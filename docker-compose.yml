services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: opsup-openwebui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-this-to-a-random-secret-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SUPERDOC_API_URL=http://superdoc:8081
      - SUPERDOC_API_PUBLIC_URL=http://localhost:${SUPERDOC_PORT:-8081}
      - SUPERDOC_ENABLE_ARTIFACT_EMBED=true
    depends_on:
      - superdoc
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - opsup-network

  superdoc:
    build:
      context: ./superdoc-v2
      dockerfile: Dockerfile
    container_name: opsup-superdoc
    restart: unless-stopped
    ports:
      - "${SUPERDOC_PORT:-8081}:8081"
    volumes:
      - documents:/app/documents
    environment:
      - NODE_ENV=production
      - DOCUMENT_STORAGE_PATH=/app/documents
      - SUPERDOC_MAX_APPLY_ACTIONS=${SUPERDOC_MAX_APPLY_ACTIONS:-50}
      - SUPERDOC_MAX_DOCUMENTS_PER_CHAT=${SUPERDOC_MAX_DOCUMENTS_PER_CHAT:-100}
    networks:
      - opsup-network

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: opsup-mcp-server
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8082}:8082"
    environment:
      - DOCUMENT_SERVICE_URL=http://superdoc:8081
      - DOCUMENT_PUBLIC_URL=http://localhost:${SUPERDOC_PORT:-8081}
    depends_on:
      - superdoc
    networks:
      - opsup-network

volumes:
  openwebui_data:
  documents:

networks:
  opsup-network:
    driver: bridge
